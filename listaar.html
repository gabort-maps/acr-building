<script>// Ugyanaz a belépés és adatbázis (Supabase, public.docs), mint az acr-admin.html-ben.
// ?helyi=1 : helyi próbamód, az adat csak ebben a böngészőben (localStorage) van.
(function () {
  const CFG = { url: 'https://vsortedjvgtzjrlaqjiq.supabase.co', key: 'sb_publishable_SaEk0Mx9x5rXKy-fgm9u_Q_nC7lK5cM' };
  const TAG = 'w' + Math.random().toString(36).slice(2, 8);
  const LOCAL = /[?&]helyi=1/.test(location.search);
  const mk = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
  let sbP = null, email = '';
  const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('nem tölt be: ' + src)); document.head.appendChild(s); });
  async function ensureLib() {
    if (window.supabase) return;
    for (const u of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js', 'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js']) { try { await loadScript(u); if (window.supabase) return; } catch (e) { } }
    throw new Error('A belépési modul nem tölthető be (a hálózat tiltja a CDN-t?).');
  }
  function fail(e) {
    document.body.appendChild(mk(`<div style="position:fixed;inset:0;z-index:9999;background:#f3f4f2;display:flex;align-items:center;justify-content:center;font:15px system-ui;padding:20px"><div style="background:#fff;border:1px solid #d3d9dc;border-radius:10px;padding:24px;max-width:460px"><b>A listaár oldal nem tud csatlakozni.</b><p>${String(e && e.message || e).replace(/</g, '&lt;')}</p></div></div>`));
  }
  const css = `<style>#sbov{position:fixed;inset:0;background:#f3f4f2;z-index:9999;display:flex;align-items:center;justify-content:center;font:15px 'IBM Plex Sans',system-ui,sans-serif;color:#1b2125}
#sbov form{background:#fff;border:1px solid #d3d9dc;border-radius:10px;padding:24px;width:min(360px,92vw);display:grid;gap:12px}
#sbov h1{font-size:18px;margin:0 0 4px}#sbov input{padding:9px;border:1px solid #b6bfc4;border-radius:6px;background:#fffcec;font:inherit}
#sbov button{padding:10px;border:0;border-radius:6px;background:#1d5d8a;color:#fff;font:inherit;cursor:pointer}#sbov .err{color:#b91c1c;min-height:1.2em;font-size:13px}</style>`;
  function login(sb) {
    return new Promise(async (res) => {
      const s = await sb.auth.getSession();
      if (s && s.data && s.data.session) { email = s.data.session.user.email || ''; return res(); }
      document.head.insertAdjacentHTML('beforeend', css);
      const ov = mk(`<div id="sbov"><form><h1>ACR listaár – belépés</h1><input type="email" id="sbe" placeholder="e-mail" autocomplete="username" required><input type="password" id="sbp" placeholder="jelszó" autocomplete="current-password" required><div class="err" id="sberr"></div><button type="submit">Belépés</button></form></div>`);
      document.body.appendChild(ov);
      ov.querySelector('form').addEventListener('submit', async (ev) => {
        ev.preventDefault(); const e = ov.querySelector('#sbe').value.trim(), p = ov.querySelector('#sbp').value;
        ov.querySelector('#sberr').textContent = 'Belépés…';
        const r = await sb.auth.signInWithPassword({ email: e, password: p });
        if (r.error) { ov.querySelector('#sberr').textContent = 'Hibás e-mail cím vagy jelszó.'; return; }
        email = e; ov.remove(); res();
      });
    });
  }
  const clean = (d) => JSON.parse(JSON.stringify(d));
  function makeDb(sb) {
    return {
      collection: (c) => ({
        onSnapshot: (cb, errcb) => {
          const m = new Map(), snap = () => ({ docs: [...m].map(([id, d]) => ({ id, data: () => d })) });
          (async () => {
            for (let from = 0; ; from += 1000) {
              const r = await sb.from('docs').select('id,data').eq('collection', c).range(from, from + 999);
              if (r.error) { if (errcb) errcb(r.error); return; }
              r.data.forEach((x) => m.set(x.id, x.data)); if (r.data.length < 1000) break;
            }
            cb(snap());
            sb.channel('lp-' + c).on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, (p) => {
              if (p.eventType === 'DELETE') { if (p.old && p.old.collection === c && m.delete(p.old.id)) cb(snap()); return; }
              if (!p.new || p.new.collection !== c || p.new.updated_by === TAG) return;
              m.set(p.new.id, p.new.data); cb(snap());
            }).subscribe();
          })();
        },
      }),
      doc: (path) => {
        const i = path.indexOf('/'), c = path.slice(0, i), id = path.slice(i + 1);
        return {
          set: async (d) => { const r = await sb.from('docs').upsert({ collection: c, id, data: clean(d), updated_by: TAG, updated_at: new Date().toISOString() }); if (r.error) throw r.error; },
          delete: async () => { const r = await sb.from('docs').delete().eq('collection', c).eq('id', id); if (r.error) throw r.error; },
        };
      },
      signOut: async () => { await sb.auth.signOut(); location.reload(); },
    };
  }
  function localDb() {
    const K = 'acrListaar.helyi'; let mem; try { mem = JSON.parse(localStorage.getItem(K) || '{}'); } catch (e) { mem = {}; }   // ha a böngésző tárolója nem érhető el, a memóriában marad
    const load = () => mem;
    const subs = {}, fire = (c) => { const all = load()[c] || {}; (subs[c] || []).forEach((cb) => cb({ docs: Object.entries(all).map(([id, d]) => ({ id, data: () => d })) })); };
    const save = (f) => { f(mem); try { localStorage.setItem(K, JSON.stringify(mem)); } catch (e) { } };
    return {
      collection: (c) => ({ onSnapshot: (cb) => { (subs[c] = subs[c] || []).push(cb); setTimeout(() => fire(c), 0); } }),
      doc: (path) => { const i = path.indexOf('/'), c = path.slice(0, i), id = path.slice(i + 1); return {
        set: async (d) => { save((a) => { (a[c] = a[c] || {})[id] = clean(d); }); },
        delete: async () => { save((a) => { if (a[c]) delete a[c][id]; }); } }; },
      signOut: null,
    };
  }
  window.LPDB = {
    local: LOCAL,
    email: () => (LOCAL ? 'helyi próba' : email),
    open: () => { if (!sbP) sbP = LOCAL ? Promise.resolve(localDb()) : (async () => { await ensureLib(); const sb = window.supabase.createClient(CFG.url, CFG.key); await login(sb); return makeDb(sb); })(); sbP.catch(fail); return sbP; },
  };
})();
</script>

const NOLET = { A: (r) => r.k === '0' || r.code === 'Lejtő' };
for (const [bid, p] of Object.entries(PACKS)) { if (NOLET[bid]) p.rooms = p.rooms.filter((r) => !NOLET[bid](r)); for (const r of p.rooms) r.b = bid; }
const ALL = Object.values(PACKS).flatMap((p) => p.rooms);
const isTer = (r) => r.cat === 'Terasz / külső';
function ar0(r) { if (!r.par) return r.a; if (r.rem) { const P = PACKS[r.b].parents[r.par]; let s = 0; for (const x of PACKS[r.b].rooms) if (x.par === r.par && !x.rem) s += (OV[x.id] && +OV[x.id].a) || 0; return Math.max(0, +((P ? P.a : 0) - s).toFixed(2)); } const o = OV[r.id]; return o && o.a ? +o.a : 0; }
const WSUM = {};
function wsum(b, k, w) { const key = b + '|' + k + '|' + w; if (!(key in WSUM)) WSUM[key] = PACKS[b].rooms.reduce((s, r) => s + (r.k === k && r.w === w && !isTer(r) ? ar0(r) : 0), 0); return WSUM[key]; }
const meas = () => (SET.meas in MEAS ? SET.meas : 'belso');
function mf(r) { if (isTer(r) || meas() === 'belso') return 1; const M = PACKS[r.b].wmeas[r.k + '|' + r.w], s = M ? wsum(r.b, r.k, r.w) : 0; return M && s > 0 && M[meas()] ? M[meas()] / s : 1; }
const area = (r) => ar0(r) * mf(r);
const stOf = (r) => { const o = OV[r.id]; return (o && o.s) || (PACKS[r.b].def || {})[r.cat] || ''; };
const nameOf = (r) => (OV[r.id] && OV[r.id].n) || r.name;
const isUnit = (r) => { const s = stOf(r); if (s === 'common' || s === 'own') return false; if (s) return true; if (r.cat === 'Bérelhető' || isTer(r)) return true; if (r.cat) return false; return !COMMONRX.test(nameOf(r).trim()); };
const hidden0 = (r) => r.par && !r.rem && !(OV[r.id] && +OV[r.id].a);   // összevont sor nulla területű része
const lvlName = (b, k) => (PACKS[b].lvl.find((l) => l[0] === k) || [k, k])[1];
const wingName = (b, w) => (PACKS[b].wings.find((x) => x[0] === w) || [w, w])[1];
const lvlsOf = (b) => { const ks = new Set(PACKS[b].rooms.map((r) => r.k)); return PACKS[b].lvl.filter((l) => ks.has(l[0])); };
const wingsOf = (b, k) => { const ws = new Set(PACKS[b].rooms.filter((r) => k === '*' || r.k === k).map((r) => r.w)); return PACKS[b].wings.filter((w) => ws.has(w[0])); };

const keyB = (b) => 'r:' + b, keyF = (b, k) => 'r:' + b + '|' + k, keyW = (b, k, w) => 'r:' + b + '|' + k + '|' + w, keyU = (id) => 'u:' + id;
const LEVEL = { b: 'épület', f: 'szint', w: 'szárny', u: 'egyedi' };
function merge(chain) {
  const acc = {}, src = {};
  for (const [lv, rule] of chain) {
    if (!rule) continue;
    if (rule.cur && acc.cur && rule.cur !== acc.cur) for (const f of PRICE) { delete acc[f]; delete src[f]; }   // más pénznem: a fölötte lévő árak nem öröklődnek
    for (const f of FIELDS) if (rule[f] != null && rule[f] !== '') { acc[f] = rule[f]; src[f] = lv; }
  }
  return { v: acc, src };
}
const chainFor = (b, k, w, id) => [['b', RULES[keyB(b)]], ['f', k !== '*' ? RULES[keyF(b, k)] : null], ['w', k !== '*' && w !== '*' ? RULES[keyW(b, k, w)] : null], ['u', id ? RULES[keyU(id)] : null]];
function priceOf(r) {

}

    <details class="cg" data-g="more"${COPEN.more ? ' open' : ''}><summary>További eredmények (${rest.length})</summary><div>${rest.map(resRow).join('')}</div></details>
    <details class="cg" data-g="keys"${COPEN.keys ? ' open' : ''}><summary>Melyik eredmény legyen a fő eredmények között?</summary><div class="keys">${RES.map(([id, lab]) => `<label><input type="checkbox" data-key="${id}"${KEYS.includes(id) ? ' checked' : ''}>${lab}</label>`).join('')}</div></details>
    <p class="hint" style="margin-top:6px">A díjak a számlázott területre (nettó + közös) járnak, az energia a nettó területre. Üres mező = 0, kivéve a területet, az ajánlati díjat és a futamidőt. Az energia forintban számolódik. Belső használatra: az ügynöki díj, a diszkontált díj és a bérbeadó bevétele nem adható ki a bérlőnek.</p>`;
}
function lpNote(x) { const v = x.lp[tierIdx(x.T)], tl = TERMS[tierIdx(x.T)][1]; if (v == null) return `<div class="lp">nincs listaár (${tl})</div>`; const d = x.R != null && !isNaN(x.R) ? (x.R / v - 1) * 100 : null; return `<div class="lp">listaár ${tl}: ${nf(v)}${d != null && Math.abs(d) > 0.005 ? ` <span class="${d < 0 ? 'bad' : 'ok'}">${d > 0 ? '+' : ''}${nf(d, 1)}%</span>` : ''}</div>`; }
function loadUnit() {
  const r = ALL.find((x) => x.id === CS.u); if (!r) return;
  const p = priceOf(r);
  for (const x of CV) { x.area = +p.cnt.toFixed(2); x.cf = p.cf != null ? p.cf : x.cf; x.lp = p.rent; if (p.sc != null) x.sc = p.sc; const t = p.rent[tierIdx(z(x.T) || 999)]; if (t != null) x.R = t; }
  if (p.cur) CS.cur = p.cur;
  CS.src = `Betöltve: ${scopeLabel(r.b, r.k, r.w)}, ${r.code} ${nameOf(r)}, ${nf(p.net)} m²${p.tw != null && p.tw !== 100 ? ` (beszámítva ${nf(p.tw, 0)}%: ${nf(p.cnt)} m²)` : ''}, közös ${p.cf != null ? nf(p.cf, 1) + '%' : 'nincs megadva'}${p.spec ? ', egyedi feltétel' : ''}${p.cur ? '' : '. Nincs listaára, csak a terület töltődött be'}. Az ajánlati díj a futamidőhöz tartozó listaár (1, 2, 3 vagy 3+ év).`;
  saveCalc(); renderCalcTop(); renderCalc();
}

// ---------- rajzolás, események ----------
function renderAll() {
  $('who').textContent = dbReady ? `${window.LPDB.email()}${canEdit() ? ' · szerkesztheti az árakat' : ' · csak megtekintés'}${window.LPDB.local ? ' · HELYI PRÓBAMÓD' : ''}` : 'betöltés…';
  $('ro').hidden = !dbReady || canEdit() || S.tab === 'calc'; $('ro').innerHTML = '<b>Csak megtekintés.</b> Az árakat a tulajdonos állítja be.';
  for (const t of ['list', 'calc', 'set']) { $('t-' + t).hidden = S.tab !== t; document.querySelector(`[data-tab="${t}"]`).classList.toggle('on', S.tab === t); }
  if (S.tab === 'list') { fillPlace($('fB'), $('fK'), $('fW'), S); $('fS').value = S.show; $('fC').value = S.cur; renderGen(); renderUnits(); renderAsis(); }
  else if (S.tab === 'calc') { renderCalcTop(); renderCalc(); }
  else renderSet();
}
document.querySelector('.tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; saveView(); renderAll(); };
$('fB').onchange = (e) => { S.b = e.target.value; S.k = '*'; S.w = '*'; S.edit = null; saveView(); renderAll(); };
$('fK').onchange = (e) => { S.k = e.target.value; S.w = '*'; S.edit = null; saveView(); renderAll(); };
$('fW').onchange = (e) => { S.w = e.target.value; S.edit = null; saveView(); renderAll(); };
$('fS').onchange = (e) => { S.show = e.target.value; saveView(); renderUnits(); };
$('fC').onchange = (e) => { S.cur = e.target.value; saveView(); renderUnits(); };
$('units').addEventListener('toggle', () => { if (!S.edit) { S.uOpen = $('units').open; saveView(); } });
$('tbl').onclick = (e) => { const u = e.target.closest('[data-ued]'); if (u) { S.edit = S.edit === u.dataset.ued ? null : u.dataset.ued; renderUnits(); } };
$('xls').onclick = exportXlsx;
$('prn').onclick = () => { buildPrint(); window.print(); };
for (const [id, f] of [['cB', 'b'], ['cK', 'k'], ['cW', 'w'], ['cU', 'u']]) $(id).onchange = (e) => { CS[f] = e.target.value; if (f === 'b') { CS.k = '*'; CS.w = '*'; CS.u = ''; } if (f === 'k') { CS.w = '*'; CS.u = ''; } if (f === 'w') CS.u = ''; if (!CS.b) { CS.src = ''; for (const x of CV) delete x.lp; } saveCalc(); renderCalcTop(); renderCalc(); };
$('cCur').onchange = (e) => { CS.cur = e.target.value; saveCalc(); renderCalc(); };
$('cLoad').onclick = loadUnit;
$('cSaveDef').onclick = () => { ls.set('acrListaar.kalkalap', { v: CV.map((x) => { const o = Object.assign({}, x); delete o.lp; return o; }), cur: CS.cur }); toast('Elmentve a saját alapértékeidként'); };
$('cLoadDef').onclick = () => { const d = ls.get('acrListaar.kalkalap', null); if (!d) { toast('Még nincs mentett alapértéked'); return; } CV = d.v.map((x) => Object.assign(blankV(), x)); CS.cur = d.cur || CS.cur; CS.src = 'Saját alapértékek betöltve.'; CS.u = ''; saveCalc(); renderCalcTop(); renderCalc(); };
$('cClear').onclick = () => { if (!confirm('Kiüríted a kalkulátor összes mezőjét?')) return; CV = [blankV(), blankV(), blankV()]; CS.src = ''; CS.u = ''; saveCalc(); renderCalcTop(); renderCalc(); };
$('calc').addEventListener('change', (e) => {
  const k = e.target.closest('[data-key]'); if (k) { KEYS = RES.map((r) => r[0]).filter((id) => (id === k.dataset.key ? k.checked : KEYS.includes(id))); ls.set('acrListaar.kulcs', KEYS); renderCalc(); return; }
  const el = e.target.closest('[data-cv]'); if (!el) return; const x = CV[+el.dataset.cv], f = el.dataset.cf;
  if (el.tagName === 'SELECT') { x[f] = el.value; if (f === 'feeType') { if (x.feeType !== 'Hónap') delete x.feeM; if (x.feeType !== '%') delete x.feeP; } }
  else { const n = numIn(el.value); if (n === undefined) delete x[f]; else x[f] = n; }
  saveCalc(); renderCalc();
});
$('calc').addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.g && d.dataset.g !== 'res') { COPEN[d.dataset.g] = d.open; ls.set('acrListaar.kalknyit', COPEN); } }, true);
renderAll();
</script>
</body></html>
